# Flutter 项目依赖配置
name: tilezhan
description: Master Mahjong, One Tile at a Time.
version: 1.0.2+5
publish_to: 'none'

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  flutter_svg: ^2.0.10+1
  path_provider: ^2.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.4.3+1
  audioplayers: ^6.0.0
  in_app_purchase: ^3.2.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  in_app_review: ^2.0.9
  http: ^1.2.0
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/nanikiru_puzzles.json
    - assets/tiles/
    - assets/mnemonic_png/
    - assets/sounds/
    - assets/sounds/voice/
