# android-build.yml: Android App Bundle 构建 CI
name: Android → Google Play

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.1', channel: stable, cache: true }

      - run: flutter pub get

      - run: flutter test

      - name: Build App Bundle
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: tilezhan-aab
          path: frontend/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.tilezhan.app
          releaseFiles: frontend/build/app/outputs/bundle/release/app-release.aab
          track: internal
